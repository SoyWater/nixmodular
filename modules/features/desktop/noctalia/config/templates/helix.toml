"ui.background" = { fg = "onSurface", bg = "background" }
"ui.text" = "onSurface"
"ui.text.focus" = { fg = "onPrimary", bg = "primary", modifiers = ["bold"] }
"ui.cursor" = { fg = "onPrimary", bg = "primary" }
"ui.selection" = { bg = "primaryContainer", fg = "onPrimaryContainer" }
"ui.menu" = { fg = "onSurface", bg = "surfaceContainer" }
"ui.menu.selected" = { fg = "onPrimary", bg = "primary" }
"ui.statusline" = { fg = "onSurface", bg = "surfaceContainerLow" }
"ui.popup" = { fg = "onSurface", bg = "surfaceContainerLow" }
"comment" = { fg = "outline", modifiers = ["italic"] }
"keyword" = { fg = "primary", modifiers = ["bold"] }
"function" = "tertiary"
"type" = "secondary"
"string" = "tertiary"
"constant" = "secondary"
"variable" = "onSurface"
"operator" = "secondary"
error = "error"
warning = "warning"
info = "info"
hint = "hint"

[palette]
primary = "{{colors.primary.default.hex}}"
onPrimary = "{{colors.on_primary.default.hex}}"
primaryContainer = "{{colors.primary_container.default.hex}}"
onPrimaryContainer = "{{colors.on_primary_container.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
background = "{{colors.background.default.hex}}"
onBackground = "{{colors.on_background.default.hex}}"
surfaceContainerLow = "{{colors.surface_container_low.default.hex}}"
surfaceContainer = "{{colors.surface_container.default.hex}}"
onSurface = "{{colors.on_surface.default.hex}}"
outline = "{{colors.outline.default.hex}}"
error = "{{colors.error.default.hex}}"
warning = "{{colors.secondary.default.hex}}"
info = "{{colors.primary.default.hex}}"
hint = "{{colors.tertiary.default.hex}}"
