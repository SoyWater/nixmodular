font_family Maple Mono NF CN
hide_window_decorations yes
window_padding_width 10 14

# Noctalia rewrites this generated theme after each palette update.
include /home/soywater/nixconfigs/.temp/noctalia/themes/kitty/dankcolors.conf

map ctrl+shift+y launch --type=overlay-main --cwd=current yazi

# Focused Kitty kitten integration.
map ctrl+shift+h kitten hints --type url
map ctrl+shift+u kitten unicode_input
