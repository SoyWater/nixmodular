font_family Maple Mono NF CN
font_size 12.0
disable_ligatures cursor

# Keep terminal output useful without making scrollback unbounded.
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Make terminal-driven UI noise unobtrusive.
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no

# Kitty's shell integration powers cwd-aware launch actions and prompt jumps.
shell_integration enabled
allow_hyperlinks yes

hide_window_decorations yes
window_padding_width 10 14

# Window and tab workflow. These keep the current shell's directory.
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab

# Vim-style window navigation: focus with h/j/k/l, move with Shift+h/j/k/l.
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window bottom
map kitty_mod+k neighboring_window top
map kitty_mod+l neighboring_window right
map kitty_mod+shift+h move_window left
map kitty_mod+shift+j move_window down
map kitty_mod+shift+k move_window up
map kitty_mod+shift+l move_window right

# Vim-style tab navigation.
map kitty_mod+n next_tab
map kitty_mod+p previous_tab
map kitty_mod+shift+n move_tab_forward
map kitty_mod+shift+p move_tab_backward

# Useful built-in kittens and scrollback navigation.
map ctrl+shift+y launch --type=overlay-main --cwd=current yazi
map ctrl+shift+o kitten hints --type=url
map ctrl+shift+u kitten unicode_input
map kitty_mod+g show_scrollback
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1

# Noctalia writes the active palette here. Keep this include last so its
# generated colors win over any static defaults in this file.
include ${HOME}/.config/kitty/kitty.conf
